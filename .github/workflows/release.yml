name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空则使用 v<versionName>）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK + unit tests
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest --no-daemon --stacktrace

      - name: APK size budget
        run: bash scripts/check_apk_size.sh

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="DodoComm-${VERSION}.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt
          VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          SIZE="$(stat -c%s "$OUT")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"
          CHANGELOG="$(python3 - "$VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              r"^## \[?" + re.escape(version) + r"\]?.*?$", text, re.MULTILINE
          )
          if not match:
              print("")
          else:
              start = match.end()
              next_header = re.search(r"^## ", text[start:], re.MULTILINE)
              body = text[start:start + next_header.start()] if next_header else text[start:]
              print(body.strip())
          PY
          )"
          export CHANGELOG
          VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" SHA="$SHA" SIZE="$SIZE" RELEASE_TAG="$RELEASE_TAG" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" python3 - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          changelog = os.environ.get("CHANGELOG", "").strip() or f"DodoComm {version} 更新。"
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": version,
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/DodoComm-{version}.apk",
              "sha256": os.environ["SHA"],
              "size": int(os.environ["SIZE"]),
              "changelog": changelog,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          printf '%s\n' "$CHANGELOG" > release-notes.md
          cat latest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${RELEASE_TAG}"
          fi
          echo "Release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "DodoComm-${VERSION}.apk" SHA256SUMS.txt latest.json --clobber
            gh release edit "$TAG" --title "嘟嘟通讯 DodoComm v${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "DodoComm-${VERSION}.apk" SHA256SUMS.txt latest.json \
              --title "嘟嘟通讯 DodoComm v${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
